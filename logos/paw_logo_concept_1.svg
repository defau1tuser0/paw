<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#F5EBE6" />
    </linearGradient>
    
    <!-- Clay Gradient for Paw Elements -->
    <linearGradient id="clay-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D47A55" />
      <stop offset="100%" stop-color="#8A4F35" />
    </linearGradient>
    
    <!-- Smooth Drop Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8A4F35" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad)" stroke="#EAE0D5" stroke-width="4" />

  <!-- Paw Graphic Group with Shadow -->
  <g filter="url(#shadow)">
    <!-- Heel Pad (Heart Shape) -->
    <path d="M 256,380 C 185,310 150,270 150,220 C 150,170 195,130 256,190 C 317,130 362,170 362,220 C 362,270 327,310 256,380 Z" fill="url(#clay-grad)" />
    
    <!-- Toes (Cute Rounded Ellipses) -->
    <ellipse cx="135" cy="195" rx="32" ry="42" fill="url(#clay-grad)" transform="rotate(-25 135 195)" />
    <ellipse cx="200" cy="130" rx="38" ry="48" fill="url(#clay-grad)" transform="rotate(-10 200 130)" />
    <ellipse cx="312" cy="130" rx="38" ry="48" fill="url(#clay-grad)" transform="rotate(10 312 130)" />
    <ellipse cx="377" cy="195" rx="32" ry="42" fill="url(#clay-grad)" transform="rotate(25 377 195)" />

    <!-- Negative Space Cutout: Cat Silhouette in Heel Pad -->
    <!-- The color matches the background gradient to simulate transparent negative space -->
    <path d="M 256,310 C 228,310 216,290 216,270 C 216,250 220,240 225,240 C 220,230 210,195 218,190 C 228,185 242,225 248,230 C 251,228 253,228 256,228 C 259,228 261,228 264,230 C 270,225 284,185 294,190 C 302,195 292,230 287,240 C 292,240 296,250 296,270 C 296,290 284,310 256,310 Z" fill="#FDFBF7" />
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient - Terracotta / Clay -->
    <linearGradient id="bg-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D47A55" />
      <stop offset="100%" stop-color="#A95435" />
    </linearGradient>
    
    <!-- Deep Warm Brown Gradient for the Paw -->
    <linearGradient id="paw-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5C3D2E" />
      <stop offset="100%" stop-color="#422A1F" />
    </linearGradient>
    
    <!-- Shadow for Hand -->
    <filter id="hand-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#422A1F" flood-opacity="0.3" />
    </filter>

    <!-- Shadow for Paw to stand out from Hand -->
    <filter id="paw-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#422A1F" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Icon Base (Terracotta/Clay background) -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad-2)" stroke="#C66B46" stroke-width="4" />

  <!-- Stylized Human Hand Supporting the Paw -->
  <path d="M 80,480 C 80,380 120,300 200,270 C 240,258 262,268 272,285 C 282,302 277,320 257,335 C 225,355 190,370 170,410 C 160,430 160,450 160,480 Z" fill="#FDFBF7" filter="url(#hand-shadow)" />

  <!-- Animal Paw cradled by the Hand (Perfect Symmetry Alignment) -->
  <g filter="url(#paw-shadow)">
    <!-- Heel Pad (Heart Shape, Centered at X=310) -->
    <path d="M 310,270 C 270,230 240,200 240,165 C 240,130 270,105 310,140 C 350,105 380,130 380,165 C 380,200 350,230 310,270 Z" fill="url(#paw-grad)" />
    
    <!-- Symmetrical Toes -->
    <ellipse cx="215" cy="155" rx="22" ry="32" fill="url(#paw-grad)" transform="rotate(-30 215 155)" />
    <ellipse cx="275" cy="105" rx="26" ry="36" fill="url(#paw-grad)" transform="rotate(-12 275 105)" />
    <ellipse cx="345" cy="105" rx="26" ry="36" fill="url(#paw-grad)" transform="rotate(12 345 105)" />
    <ellipse cx="405" cy="155" rx="22" ry="32" fill="url(#paw-grad)" transform="rotate(30 405 155)" />
  </g>
</svg>

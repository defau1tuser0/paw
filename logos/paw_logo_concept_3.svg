<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient - Sand to Cream -->
    <linearGradient id="bg-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDFBF7" />
      <stop offset="100%" stop-color="#EAE0D5" />
    </linearGradient>
    
    <!-- Clay Gradient for Geometric Paw -->
    <linearGradient id="clay-grad-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D47A55" />
      <stop offset="100%" stop-color="#8A4F35" />
    </linearGradient>
    
    <!-- Smooth Drop Shadow -->
    <filter id="shadow-3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#8A4F35" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- App Icon Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="url(#bg-grad-3)" stroke="#D8CFC4" stroke-width="4" />

  <!-- Paw Graphic Group with Shadow -->
  <g filter="url(#shadow-3)">
    <!-- Heel Pad (Geometric Bean Shape) -->
    <path d="M 140,290 C 140,210 200,180 256,200 C 312,180 372,210 372,290 C 372,360 320,400 256,400 C 192,400 140,360 140,290 Z" fill="url(#clay-grad-3)" />
    
    <!-- Toes (Modern Geometric Ellipses) -->
    <ellipse cx="120" cy="215" rx="28" ry="40" fill="url(#clay-grad-3)" transform="rotate(-30 120 215)" />
    <ellipse cx="190" cy="145" rx="32" ry="46" fill="url(#clay-grad-3)" transform="rotate(-12 190 145)" />
    <ellipse cx="322" cy="145" rx="32" ry="46" fill="url(#clay-grad-3)" transform="rotate(12 322 145)" />
    <ellipse cx="392" cy="215" rx="28" ry="40" fill="url(#clay-grad-3)" transform="rotate(30 392 215)" />

    <!-- House Cutout (Blends with background gradient to simulate transparent negative space) -->
    <rect x="272" y="260" width="10" height="25" fill="#FDFBF7" />
    <path d="M 256,255 L 216,295 L 231,295 L 231,345 L 281,345 L 281,295 L 296,295 Z" fill="#FDFBF7" />
    
    <!-- Arch Door Cutout (Matching the Paw color to simulate entrance opening) -->
    <path d="M 248,345 L 248,325 C 248,320 264,320 264,325 L 264,345 Z" fill="url(#clay-grad-3)" />
  </g>
</svg>
